name: Sculptify Checkout Security
on:
  push:
    branches:
      - fix/checkout-link-safety-2026-10-29
      - main
  pull_request:
    paths:
      - app.js
      - tests/checkout-link-security.test.cjs
      - .github/workflows/checkout-security.yml
permissions:
  contents: read
jobs:
  checkout-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --test tests/checkout-link-security.test.cjs
