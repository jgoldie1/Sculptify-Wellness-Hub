<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Template Editor</title>
<style>body{margin:0;background:#0a070b;color:#fff8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.5}main{width:min(900px,calc(100% - 24px));margin:30px auto 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-family:Georgia,serif;color:#efce7c;font-size:2rem}.card{border:1px solid #49344d;background:#151017;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;box-sizing:border-box;background:#0d090e;color:white;border:1px solid #4a354e;border-radius:11px;padding:12px;font:inherit}label{display:block;font-size:.76rem;color:#ccb8c8;margin-bottom:8px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#d896ff,#ff91b8);color:#180d18}.gold{background:linear-gradient(135deg,#f2d48c,#d59638);color:#1d1208}.outline{background:transparent;border:1px solid #795b7e;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{color:#87e4ab;font-size:.82rem}.small{color:#a993a5;font-size:.78rem}.hidden{display:none}.site-row{border:1px solid #3b293f;border-radius:12px;padding:10px;margin:8px 0}.site-row b,.site-row small{display:block}.site-row small{color:#a993a5}.services-help{color:#a993a5;font-size:.72rem}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main>
<div class="top"><div><div class="small">BUSINESS-IN-A-BOX</div><div class="brand">Template Editor</div></div><a class="btn outline" href="./index.html">Back to Sculptify</a></div>
<div id="login" class="card"><h2>Client Sign-In</h2><p class="small">Enter the email Sculptify used when your business template was created. You will receive a secure magic link.</p><input id="email" type="email" placeholder="Your email"><p><button id="login-btn" class="btn gold">Email My Sign-In Link</button></p><p id="login-status" class="status"></p></div>
<div id="workspace" class="hidden"><div class="card"><h2>Your Business Sites</h2><div id="sites"></div></div>
<form id="editor" class="card hidden"><h2>Edit Your Website</h2><div class="grid"><label>Business name<input id="business-name"></label><label>Business type<input id="vertical"></label><label>Location<input id="location"></label><label>Public email<input id="contact-email" type="email"></label><label>Public phone<input id="contact-phone"></label><label>Logo image URL<input id="logo-url" type="url"></label></div>
<label>Hero headline<input id="hero-title"></label><label>Hero subtitle<textarea id="hero-subtitle" rows="3"></textarea></label>
<div class="grid"><label>Primary color<input id="primary" type="color"></label><label>Secondary color<input id="secondary" type="color"></label><label>Accent color<input id="accent" type="color"></label><label>Background color<input id="background" type="color"></label></div>
<div class="grid"><label>Booking link<input id="booking-url" type="url"></label><label>Store link<input id="store-url" type="url"></label><label>Button label<input id="cta-label"></label><label>Site slug<input id="slug" readonly></label></div>
<label>Services <span class="services-help">One per line: Name | Description | Price</span><textarea id="services" rows="7"></textarea></label>
<label>FAQs <span class="services-help">One per line: Question | Answer</span><textarea id="faqs" rows="6"></textarea></label>
<label>Products <span class="services-help">One per line: Name | Description | Price</span><textarea id="products" rows="6"></textarea></label>
<div class="actions"><button class="btn" type="submit">Save Draft</button><button class="btn gold" id="publish" type="button">Publish</button><button class="btn outline" id="preview" type="button">Preview</button></div><p id="save-status" class="status"></p></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./client-editor.js"></script></main></body></html>
