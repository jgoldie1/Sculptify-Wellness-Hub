<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0810"><title>Business Site</title>
<style>
:root{--primary:#d896ff;--secondary:#e9c77f;--accent:#ff91b8;--bg:#09070a;--text:#fff;--muted:#c8b8c5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.55}a{color:inherit}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.nav{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--secondary) 35%,transparent);z-index:10}.nav .wrap{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Georgia,serif;color:var(--secondary);font-size:1.5rem;font-weight:800}.nav a{text-decoration:none}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 17px;border-radius:12px;text-decoration:none;font-weight:800;border:1px solid transparent;background:linear-gradient(135deg,var(--primary),var(--accent));color:#160d17}.hero{padding:84px 0 58px;background:radial-gradient(circle at 85% 10%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 28%)}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}.kicker{display:inline-flex;border:1px solid color-mix(in srgb,var(--secondary) 55%,transparent);color:var(--secondary);border-radius:999px;padding:6px 10px;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:clamp(2.8rem,6vw,5.5rem);line-height:.96;margin:16px 0;color:var(--secondary)}.hero p{color:var(--muted);font-size:1.05rem}.hero-card{border:1px solid color-mix(in srgb,var(--secondary) 50%,transparent);border-radius:28px;padding:28px;background:linear-gradient(150deg,color-mix(in srgb,var(--primary) 20%,var(--bg)),var(--bg));min-height:330px;display:grid;align-content:center}.hero-card img{max-width:160px;max-height:120px;object-fit:contain;margin-bottom:16px}.section{padding:58px 0}.section.alt{background:color-mix(in srgb,var(--bg) 86%,white 4%)}h2{font-family:Georgia,serif;color:var(--secondary);font-size:clamp(2rem,4vw,3rem);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);border-radius:18px;padding:20px;background:color-mix(in srgb,var(--bg) 88%,white 4%)}.card h3{margin:6px 0}.card p{color:var(--muted);font-size:.9rem}.price{color:var(--secondary);font-weight:900}.contact{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contact div{border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);border-radius:14px;padding:14px}.contact small{display:block;color:var(--muted)}.faq details{border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:14px;padding:14px;margin:9px 0}.faq summary{font-weight:800;cursor:pointer;color:var(--secondary)}footer{border-top:1px solid color-mix(in srgb,var(--secondary) 30%,transparent);padding:30px 0;color:var(--muted)}.powered{font-size:.76rem;color:var(--primary)}.empty{padding:80px 20px;text-align:center;color:var(--muted)}@media(max-width:800px){.hero-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{width:min(100% - 20px,1100px)}.hero{padding-top:54px}}
</style></head><body>
<div id="app"><div class="empty">Loading business site…</div></div>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./client.js"></script>
</body></html>
